#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages configuration for jojojiji.com.
#
# Secrets are NOT stored here. Set them once with:
#   npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name jojojiji
#   npx wrangler pages secret put ADMIN_TOKEN          --project-name jojojiji
#   npx wrangler pages secret put IP_HASH_SALT         --project-name jojojiji

name = "jojojiji"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# Comments database. Create it with:
#   npx wrangler d1 create jojojiji-comments
# then paste the returned database_id below.
[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "jojojiji-comments"
database_id = "75671fc8-33d9-4b12-bdc0-6f725c41256b"

# Plain (non-secret) runtime variables. The Google client ID is public by design:
# it is embedded in the page HTML for the sign-in button.
[vars]
# Require Google sign-in to comment. Set to "true" to also accept anonymous
# comments (which then require a name and must pass Turnstile).
ALLOW_ANONYMOUS = "false"
# Publish Google-verified comments without review. Leave "false" to moderate everything.
AUTO_APPROVE_VERIFIED = "false"
# From Google Cloud Console -> Credentials -> OAuth 2.0 Client ID (Web application).
# Must match the PUBLIC_GOOGLE_CLIENT_ID repository variable used at build time.
GOOGLE_CLIENT_ID = "877700087632-h62bs6cr4le6c83jqi1ksls2qpp9v687.apps.googleusercontent.com"
